[package]
name = "fleet-jepa-midi"
version = "0.1.0"
edition = "2021"
description = "Three-layer real-time music intelligence: JEPA perception + algorithmic engines + LLM direction"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
midly = "0.5"
ndarray = "0.16"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
assert_approx_eq = "1"
